<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{fragments/head :: head(~{})},~{::main})}"
      xmlns:th="http://www.thymeleaf.org">

<body>
<main>
    <div style="max-width: 720px; margin: 2rem auto; padding: 0 1rem;">

        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem;">
            <h1 style="margin: 0; font-size: 1.8rem; font-weight: 700; color: #1a1a1a;">Adicionar Endereço</h1>
            <a href="/enderecos" style="color: #0066cc; font-size: 0.95rem; text-decoration: none;">← Voltar para Meus Endereços</a>
        </div>

        <div style="background: #fff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); padding: 2.5rem;">
            <form th:action="@{/enderecos}" th:object="${endereco}" method="post">

                <!-- CEP -->
                <div style="margin-bottom: 1.5rem;">
                    <label for="cep" style="display: block; font-weight: 600; color: #333; margin-bottom: 0.5rem; font-size: 0.95rem;">CEP</label>
                    <input type="text" id="cep" th:field="*{cep}" required placeholder="00000-000"
                           style="width: 200px; padding: 0.75rem 1rem; font-size: 1rem; border: 1.5px solid #d0d0d0; border-radius: 8px; outline: none; box-sizing: border-box; transition: border-color 0.2s;"
                           onfocus="this.style.borderColor='#0066cc'" onblur="this.style.borderColor='#d0d0d0'">
                </div>

                <!-- Logradouro + Número -->
                <div style="display: flex; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap;">
                    <div style="flex: 3; min-width: 200px;">
                        <label for="logradouro" style="display: block; font-weight: 600; color: #333; margin-bottom: 0.5rem; font-size: 0.95rem;">Logradouro</label>
                        <input type="text" id="logradouro" th:field="*{logradouro}" required placeholder="Rua, Avenida, etc."
                               style="width: 100%; padding: 0.75rem 1rem; font-size: 1rem; border: 1.5px solid #d0d0d0; border-radius: 8px; outline: none; box-sizing: border-box; transition: border-color 0.2s;"
                               onfocus="this.style.borderColor='#0066cc'" onblur="this.style.borderColor='#d0d0d0'">
                    </div>
                    <div style="flex: 1; min-width: 100px;">
                        <label for="numero" style="display: block; font-weight: 600; color: #333; margin-bottom: 0.5rem; font-size: 0.95rem;">Número</label>
                        <input type="text" id="numero" th:field="*{numero}" required placeholder="Ex: 100"
                               style="width: 100%; padding: 0.75rem 1rem; font-size: 1rem; border: 1.5px solid #d0d0d0; border-radius: 8px; outline: none; box-sizing: border-box; transition: border-color 0.2s;"
                               onfocus="this.style.borderColor='#0066cc'" onblur="this.style.borderColor='#d0d0d0'">
                    </div>
                </div>

                <!-- Complemento + Bairro -->
                <div style="display: flex; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap;">
                    <div style="flex: 1; min-width: 150px;">
                        <label for="complemento" style="display: block; font-weight: 600; color: #333; margin-bottom: 0.5rem; font-size: 0.95rem;">Complemento <span style="color: #888; font-weight: 400; font-size: 0.85rem;">(opcional)</span></label>
                        <input type="text" id="complemento" th:field="*{complemento}" placeholder="Apto, Bloco, etc."
                               style="width: 100%; padding: 0.75rem 1rem; font-size: 1rem; border: 1.5px solid #d0d0d0; border-radius: 8px; outline: none; box-sizing: border-box; transition: border-color 0.2s;"
                               onfocus="this.style.borderColor='#0066cc'" onblur="this.style.borderColor='#d0d0d0'">
                    </div>
                    <div style="flex: 1; min-width: 150px;">
                        <label for="bairro" style="display: block; font-weight: 600; color: #333; margin-bottom: 0.5rem; font-size: 0.95rem;">Bairro</label>
                        <input type="text" id="bairro" th:field="*{bairro}" required placeholder="Nome do bairro"
                               style="width: 100%; padding: 0.75rem 1rem; font-size: 1rem; border: 1.5px solid #d0d0d0; border-radius: 8px; outline: none; box-sizing: border-box; transition: border-color 0.2s;"
                               onfocus="this.style.borderColor='#0066cc'" onblur="this.style.borderColor='#d0d0d0'">
                    </div>
                </div>

                <!-- Cidade + Estado -->
                <div style="display: flex; gap: 1rem; margin-bottom: 2.5rem; flex-wrap: wrap;">
                    <div style="flex: 3; min-width: 200px;">
                        <label for="cidade" style="display: block; font-weight: 600; color: #333; margin-bottom: 0.5rem; font-size: 0.95rem;">Cidade</label>
                        <input type="text" id="cidade" th:field="*{cidade}" required placeholder="Nome da cidade"
                               style="width: 100%; padding: 0.75rem 1rem; font-size: 1rem; border: 1.5px solid #d0d0d0; border-radius: 8px; outline: none; box-sizing: border-box; transition: border-color 0.2s;"
                               onfocus="this.style.borderColor='#0066cc'" onblur="this.style.borderColor='#d0d0d0'">
                    </div>
                    <div style="flex: 1; min-width: 80px;">
                        <label for="estado" style="display: block; font-weight: 600; color: #333; margin-bottom: 0.5rem; font-size: 0.95rem;">Estado (UF)</label>
                        <input type="text" id="estado" th:field="*{estado}" required placeholder="Ex: TO" maxlength="2"
                               style="width: 100%; padding: 0.75rem 1rem; font-size: 1rem; border: 1.5px solid #d0d0d0; border-radius: 8px; outline: none; box-sizing: border-box; transition: border-color 0.2s; text-transform: uppercase;"
                               onfocus="this.style.borderColor='#0066cc'" onblur="this.style.borderColor='#d0d0d0'">
                    </div>
                </div>

                <!-- Botões -->
                <div style="display: flex; gap: 1rem; border-top: 1px solid #eee; padding-top: 1.5rem;">
                    <a href="/enderecos"
                       style="flex: 1; text-align: center; padding: 0.85rem; font-size: 1rem; font-weight: 600; color: #555; background: #f5f5f5; border: 1.5px solid #ddd; border-radius: 8px; text-decoration: none; transition: background 0.2s;"
                       onmouseover="this.style.background='#e8e8e8'" onmouseout="this.style.background='#f5f5f5'">
                        Cancelar
                    </a>
                    <button type="submit"
                            style="flex: 2; padding: 0.85rem; font-size: 1rem; font-weight: 600; color: #fff; background: #0066cc; border: none; border-radius: 8px; cursor: pointer; transition: background 0.2s;"
                            onmouseover="this.style.background='#0052a3'" onmouseout="this.style.background='#0066cc'">
                        ✓ Salvar Endereço
                    </button>
                </div>

            </form>
        </div>
    </div>
</main>
</body>
</html>
