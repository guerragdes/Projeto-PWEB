<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{fragments/head :: head(~{})},~{::main})}"
      xmlns:th="http://www.thymeleaf.org">

<body>
<main>
    <h1>Adicionar Novo Administrador</h1>

    <div th:if="${erro}" class="alert alert-danger" role="alert">
        <strong>❌ Erro!</strong> <span th:text="${erro}"></span>
    </div>

    <form th:action="@{/admin/cadastrar}" method="post" class="form-group" style="max-width: 600px; margin-top: 20px;"> 
        <div class="mb-3">
            <label for="login" class="form-label">Login:</label>
            <input type="text" class="form-control" id="login" name="login" required autofocus>
        </div>

        <div class="mb-3">
            <label for="nome" class="form-label">Nome Completo:</label>
            <input type="text" class="form-control" id="nome" name="nome" required>
        </div>

        <div class="mb-3">
            <label for="email" class="form-label">Email:</label>
            <input type="email" class="form-control" id="email" name="email" required>
        </div>

        <div class="mb-3">
            <label for="senha" class="form-label">Senha:</label>
            <input type="password" class="form-control" id="senha" name="senha" required>
        </div>

        <div class="mb-3">
            <label for="confirmaSenha" class="form-label">Confirmar Senha:</label>
            <input type="password" class="form-control" id="confirmaSenha" name="confirmaSenha" required>
        </div>

        <button type="submit" class="btn btn-primary" style="background-color: #0066cc;">Salvar Administrador</button>
        <a href="/clientes" class="btn btn-secondary">Cancelar</a>
    </form>
</main>
</body>
</html>
