<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{fragments/head :: head(~{})},~{::main})}"
      xmlns:th="http://www.thymeleaf.org">

<body>
<main>
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
        <h1 class="mb-0">👥 Clientes</h1>
        <a href="/clientes/novo" class="btn btn-primary" style="border-radius: 8px; padding: 0.7rem 1.5rem; font-weight: 500;">+ Novo Cliente</a>
    </div>

    <div class="filter-form p-4 mb-4" style="background: linear-gradient(135deg, #f5f7fa 0%, #fff 100%); border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08);">
        <h5 class="mb-3" style="color: #1a1a1a; font-weight: 600;">Filtrar Clientes</h5>
        <form method="get" action="/clientes" class="d-flex flex-wrap gap-3 align-items-end">
            <div style="flex: 1; min-width: 250px;">
                <label for="nome" class="form-label fw-500">Nome:</label>
                <input type="text" id="nome" name="nome" th:value="${nome}" 
                       placeholder="Buscar por nome..." 
                       class="form-control" 
                       style="border-radius: 8px; border: 1px solid #e0e0e0; padding: 0.7rem;">
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary" style="border-radius: 8px; padding: 0.7rem 1.5rem; font-weight: 500;">🔍 Filtrar</button>
                <a href="/clientes" class="btn btn-outline-secondary" style="border-radius: 8px; padding: 0.7rem 1.5rem; font-weight: 500;">↻ Limpar</a>
            </div>
        </form>
    </div>

    <div th:if="${listaClientes.isEmpty()}" class="empty-message text-center py-5" style="background: linear-gradient(135deg, #f5f7fa 0%, #fff 100%); border-radius: 12px; border: 2px dashed #e0e0e0;">
        <p style="font-size: 18px; color: #667; margin: 0;">Nenhum cliente cadastrado.</p>
    </div>

    <div class="table-responsive" th:unless="${listaClientes.isEmpty()}">
        <table class="table" style="border-collapse: collapse;">
            <thead style="background-color: #f5f7fa; border-bottom: 2px solid #e0e0e0;">
                <tr>
                    <th class="p-3" style="color: #1a1a1a; font-weight: 600;">ID</th>
                    <th class="p-3" style="color: #1a1a1a; font-weight: 600;">Nome</th>
                    <th class="p-3" style="color: #1a1a1a; font-weight: 600;">CPF</th>
                    <th class="p-3" style="color: #1a1a1a; font-weight: 600;">Email</th>
                    <th class="p-3" style="color: #1a1a1a; font-weight: 600;">Telefone</th>
                    <th class="text-center p-3" style="color: #1a1a1a; font-weight: 600;">Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="cliente : ${listaClientes}" style="border-bottom: 1px solid #e0e0e0; transition: background-color 0.2s ease;">
                    <td class="p-3" style="color: #667;">#<span th:text="${cliente.id}"></span></td>
                    <td class="p-3" style="color: #1a1a1a; font-weight: 500;" th:text="${cliente.nome}"></td>
                    <td class="p-3" style="color: #667;" th:text="${cliente.cpf}"></td>
                    <td class="p-3" style="color: #667;" th:text="${cliente.email}"></td>
                    <td class="p-3" style="color: #667;" th:text="${cliente.telefone}"></td>
                    <td class="text-center p-3">
                        <a th:href="@{/vendas/cliente/{id}(id=${cliente.id})}" class="btn btn-sm" style="background-color: #0066cc; color: white; border-radius: 6px; padding: 0.4rem 0.8rem; font-weight: 500; text-decoration: none; transition: all 0.2s ease;">🛍️ Compras</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <style>
        body {
            background-color: #fafbfc;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }

        .btn-primary {
            background-color: #0066cc !important;
            border-color: #0066cc !important;
        }

        .btn-primary:hover {
            background-color: #0052a3 !important;
            border-color: #0052a3 !important;
            transform: translateY(-2px);
        }

        .form-control {
            transition: all 0.2s ease;
        }

        .form-control:focus {
            border-color: #0066cc !important;
            box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.1) !important;
        }

        tbody tr:hover {
            background-color: #f5f7fa !important;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.5rem !important;
            }

            .table {
                font-size: 0.9rem;
            }

            td, th {
                padding: 0.75rem 0.5rem !important;
            }
        }
    </style>
</main>
</body>
</html>
        </tbody>
    </table>
</main>
</body>
</html>
