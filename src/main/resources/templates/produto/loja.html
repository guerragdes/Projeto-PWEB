<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{fragments/head :: head(~{})},~{::main})}"
      xmlns:th="http://www.thymeleaf.org">

<body>
<main>
    <div class="mb-3">
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
            <h1 class="mb-0">Loja de Produtos</h1>
            <a href="/carrinho" class="btn btn-primary btn-lg position-relative" style="border-radius: 12px; padding: 0.6rem 1.5rem;">
                🛒 Ver Carrinho
                <span class="badge bg-danger position-absolute top-0 start-100 translate-middle" 
                      th:text="${quantidadeCarrinho}" 
                      th:if="${quantidadeCarrinho > 0}">0</span>
            </a>
        </div>

        <div class="filter-form p-3 mb-3" style="background: linear-gradient(135deg, #f5f7fa 0%, #fff 100%); border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08);">
            <form method="get" action="/produtos/loja" class="d-flex flex-wrap gap-3 align-items-end">
                <div style="flex: 1; min-width: 230px;">
                    <label for="descricao" class="form-label fw-500">Pesquisar Produto:</label>
                    <input type="text" id="descricao" name="descricao" th:value="${descricao}" 
                           placeholder="Digite o nome do produto..." 
                           class="form-control" 
                           style="border-radius: 8px; border: 1px solid #e0e0e0; padding: 0.7rem;">
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary" style="border-radius: 8px; padding: 0.7rem 1.5rem; font-weight: 500;">
                        🔍 Filtrar
                    </button>
                    <a href="/produtos/loja" class="btn btn-outline-secondary" style="border-radius: 8px; padding: 0.7rem 1.5rem; font-weight: 500;">
                        ↻ Limpar
                    </a>
                </div>
            </form>
        </div>
    </div>

    <div th:if="${SucessoKey}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${SucessoKey}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div th:if="${listaProdutos.isEmpty()}" class="empty-message text-center py-5" style="background: #f9fafb; border-radius: 12px; border: 2px dashed #e0e0e0;">
        <p style="font-size: 18px; color: #667; margin: 0;">Nenhum produto encontrado.</p>
        <p style="color: #999; margin-top: 0.5rem;">Tente ajustar seus filtros de busca.</p>
    </div>

    <!-- Cards de Produtos -->
    <div class="row g-4" th:unless="${listaProdutos.isEmpty()}">
        <div class="col-12 col-sm-6 col-md-4 col-lg-3" th:each="produto : ${listaProdutos}">
            <div class="card h-100 shadow-sm" style="transition: all 0.3s ease; border: 1px solid #e0e0e0; border-radius: 12px; overflow: hidden;">
                <!-- Imagem do Produto -->
                <div th:if="${produto.imagemUrl != null}" class="card-img-wrapper">
                    <img th:src="@{'/images/produtos/' + ${produto.imagemUrl}}"
                         th:alt="${produto.descricao}"
                         class="card-img-top produto-img">
                </div>
                <div th:unless="${produto.imagemUrl != null}" class="card-img-wrapper produto-img-placeholder">
                    <span style="font-size: 48px; color: #ccc;">📦</span>
                    <span style="font-size: 13px; color: #aaa; margin-top: 4px;">Sem imagem</span>
                </div>

                <div class="card-body d-flex flex-column" style="padding: 1.5rem;">
                    <h5 class="card-title mb-3" style="color: #1a1a1a; font-weight: 600; line-height: 1.4;">
                        <span th:text="${produto.descricao}">Descrição do Produto</span>
                    </h5>

                    <div class="mt-auto">
                        <p class="card-text text-danger fw-bold mb-3" style="font-size: 22px; margin: 0;">
                            <span th:text="|R$ ${#numbers.formatDecimal(produto.valor, 1, 2)}|">R$ 0,00</span>
                        </p>

                        <form th:action="@{/carrinho/adicionar/{id}(id=${produto.id})}" method="post">
                            <button type="submit" class="btn btn-success w-100" style="border-radius: 8px; padding: 0.7rem; font-weight: 500; transition: all 0.2s ease;">
                                🛍️ Adicionar ao Carrinho
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <style>
        body {
            background-color: #fafbfc;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }

        /* Imagem do Produto */
        .card-img-wrapper {
            overflow: hidden;
        }

        .produto-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            object-position: center;
            transition: transform 0.3s ease;
        }

        .card:hover .produto-img {
            transform: scale(1.05);
        }

        .produto-img-placeholder {
            width: 100%;
            height: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #f0f2f5;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.12) !important;
            border-color: #0066cc !important;
        }

        .btn-success {
            background-color: #10b981 !important;
            border-color: #10b981 !important;
        }

        .btn-success:hover {
            background-color: #059669 !important;
            border-color: #059669 !important;
            transform: translateY(-2px);
        }

        .btn-primary {
            background-color: #0066cc !important;
            border-color: #0066cc !important;
        }

        .btn-primary:hover {
            background-color: #0052a3 !important;
            border-color: #0052a3 !important;
            transform: translateY(-2px);
        }

        .form-control {
            transition: all 0.2s ease;
        }

        .form-control:focus {
            border-color: #0066cc !important;
            box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.1) !important;
        }

        /* Reduce only the gap between the filter bar and a following alert
           without changing the spacing between the filter and the product cards. */
        .filter-form + .alert {
            margin-top: 0.5rem !important;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.75rem !important;
            }

            .btn-lg {
                padding: 0.5rem 1rem !important;
                font-size: 0.95rem !important;
            }
        }
    </style>
</main>
</body>
</html>
