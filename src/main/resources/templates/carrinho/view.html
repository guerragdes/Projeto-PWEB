<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{fragments/head :: head(~{})},~{::main})}"
      xmlns:th="http://www.thymeleaf.org">

<body>
<main>
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px">
        <h1>Carrinho de Compras</h1>
        <a href="/produtos/loja" class="btn btn-outline-primary">Continuar Comprando</a>
    </div>

    <!-- Mensagem de carrinho vazio -->
    <div th:if="${itens.isEmpty()}" class="empty-message" style="text-align: center; padding: 60px; background-color: #f9f9f9; border-radius: 8px;">
        <p style="font-size: 20px; color: #999; margin-bottom: 20px;">Seu carrinho está vazio</p>
        <a href="/produtos/loja" class="btn btn-primary btn-lg">Começar a Comprar</a>
    </div>

    <div th:unless="${itens.isEmpty()}">
        <div class="table-responsive mb-4">
            <table class="table table-hover table-striped">
                <thead class="table-light">
                    <tr>
                        <th>Produto</th>
                        <th class="text-center">Valor Unitário</th>
                        <th class="text-center">Quantidade</th>
                        <th class="text-center">Subtotal</th>
                        <th class="text-center">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="item : ${itens}">
                        <td th:text="${item.produto.descricao}">Produto</td>
                        <td class="text-center">
                            <strong th:text="|R$ ${#numbers.formatDecimal(item.produto.valor, 1, 2)}|">R$ 0,00</strong>
                        </td>
                        <td class="text-center">
                            <form th:action="@{/carrinho/atualizar-quantidade}" method="post" style="display: flex; justify-content: center; gap: 5px;">
                                <input type="hidden" name="produtoId" th:value="${item.produto.id}">
                                <input type="number" name="quantidade" th:value="${item.quantidade}" min="1" step="1" style="width: 60px; padding: 5px; text-align: center;" required>
                                <button type="submit" class="btn btn-sm btn-outline-secondary">↻</button>
                            </form>
                        </td>
                        <td class="text-center">
                            <strong th:text="|R$ ${#numbers.formatDecimal(item.total(), 1, 2)}|" style="color: #28a745;">R$ 0,00</strong>
                        </td>
                        <td class="text-center">
                            <form th:action="@{/carrinho/remover/{id}(id=${item.produto.id})}" method="post" style="display: inline;">
                                <button type="submit" class="btn btn-sm btn-danger">🗑️ Remover</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Resumo e Seleção de Cliente -->
        <div class="row">
            <div class="col-md-8">
                <div class="card border-light shadow-sm p-4" style="background-color: #f8f9fa;">
                    <h5>Selecione um Cliente</h5>
                    <form th:action="@{/carrinho/finalizar}" method="post">
                        <div class="mb-3">
                            <label for="clienteId" class="form-label">Cliente</label>
                            <select id="clienteId" name="clienteId" class="form-select">
                                <option value="">-- Selecione um Cliente --</option>
                                <option th:each="cliente : ${clientes}"
                                        th:value="${cliente.id}"
                                        th:text="${cliente.displayName}">
                                    Cliente
                                </option>
                            </select>
                            <div class="text-danger" th:if="${erroKey}" th:text="#{${erroKey}}"></div>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-success btn-lg">Finalizar Compra</button>
                            <form th:action="@{/carrinho/limpar}" method="post" style="display: inline;">
                                <button type="submit" class="btn btn-outline-danger">Limpar Carrinho</button>
                            </form>
                        </div>
                    </form>
                </div>       
            </div>

            <!-- Resumo do Total -->
            <div class="col-md-4">
                <div class="card border-success shadow-sm" style="background-color: #e8f5e9;">
                    <div class="card-body">
                        <h5 class="card-title">Resumo da Compra</h5>
                        <hr>
                        <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                            <span>Subtotal:</span>
                            <strong th:text="|R$ ${#numbers.formatDecimal(total, 1, 2)}|">R$ 0,00</strong>
                        </div>
                        <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                            <span>Frete:</span>
                            <strong>R$ 0,00</strong>
                        </div>
                        <hr>
                        <div style="display: flex; justify-content: space-between; font-size: 18px; font-weight: bold; color: #28a745;">
                            <span>TOTAL:</span>
                            <span th:text="|R$ ${#numbers.formatDecimal(total, 1, 2)}|">R$ 0,00</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
