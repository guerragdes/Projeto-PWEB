<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{fragments/head :: head(~{})},~{::main})}"
      xmlns:th="http://www.thymeleaf.org">

<body>
    <main>
        <h1 class="mb-4">📊 Lista de Vendas</h1>

        <div class="filter-form p-4 mb-4" style="background: linear-gradient(135deg, #f5f7fa 0%, #fff 100%); border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08);">
            <h5 class="mb-3" style="color: #1a1a1a; font-weight: 600;">Filtrar Vendas</h5>
            <form method="get" action="/vendas" class="d-flex flex-wrap gap-3 align-items-end">
                <div style="flex: 1; min-width: 250px;">
                    <label for="dataInicio" class="form-label fw-500">Data Início:</label>
                    <input type="date" id="dataInicio" name="dataInicio" th:value="${dataInicio}" 
                           class="form-control" 
                           style="border-radius: 8px; border: 1px solid #e0e0e0; padding: 0.7rem;">
                </div>

                <div style="flex: 1; min-width: 250px;">
                    <label for="dataFim" class="form-label fw-500">Data Fim:</label>
                    <input type="date" id="dataFim" name="dataFim" th:value="${dataFim}" 
                           class="form-control" 
                           style="border-radius: 8px; border: 1px solid #e0e0e0; padding: 0.7rem;">
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary" style="border-radius: 8px; padding: 0.7rem 1.5rem; font-weight: 500;">🔍 Filtrar</button>
                    <a href="/vendas" class="btn btn-outline-secondary" style="border-radius: 8px; padding: 0.7rem 1.5rem; font-weight: 500;">↻ Limpar</a>
                </div>
            </form>
        </div>

        <div th:if="${listaVendas.isEmpty()}" class="empty-message text-center py-5" style="background: linear-gradient(135deg, #f5f7fa 0%, #fff 100%); border-radius: 12px; border: 2px dashed #e0e0e0;">
            <p style="font-size: 18px; color: #667; margin: 0;">Nenhuma venda encontrada.</p>
        </div>

        <div class="table-responsive" th:unless="${listaVendas.isEmpty()}">
            <table class="table" style="border-collapse: collapse;">
                <thead style="background-color: #f5f7fa; border-bottom: 2px solid #e0e0e0;">
                    <tr>
                        <th class="p-3" style="color: #1a1a1a; font-weight: 600;">ID</th>
                        <th class="p-3" style="color: #1a1a1a; font-weight: 600;">Data</th>
                        <th class="p-3" style="color: #1a1a1a; font-weight: 600;">Cliente</th>
                        <th class="text-center p-3" style="color: #1a1a1a; font-weight: 600;">Total</th>
                        <th class="text-center p-3" style="color: #1a1a1a; font-weight: 600;">Ação</th>
                    </tr>
                </thead>

                <tbody>
                    <tr th:each="venda : ${listaVendas}" style="border-bottom: 1px solid #e0e0e0; transition: background-color 0.2s ease;">
                        <td class="p-3" style="color: #667;">#<span th:text="${venda.id}"></span></td>
                        <td class="p-3" style="color: #667;" th:text="${#temporals.format(venda.getData(), 'dd/MM/yyyy HH:mm')}"></td>
                        <td class="p-3" style="color: #1a1a1a; font-weight: 500;" th:text="${venda.cliente != null ? venda.cliente.displayName : 'N/A'}"></td>
                        <td class="text-center p-3">
                            <strong style="color: #0066cc; font-size: 16px;" th:text="|R$ ${#numbers.formatDecimal(venda.total(), 1, 2)}|"></strong>
                        </td>
                        <td class="text-center p-3">
                            <a th:href="@{/vendas/{id}(id=${venda.id})}" class="btn btn-sm" style="background-color: #0066cc; color: white; border-radius: 6px; padding: 0.4rem 0.8rem; font-weight: 500; text-decoration: none; transition: all 0.2s ease;">📋 Detalhes</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <style>
            body {
                background-color: #fafbfc;
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            }

            .btn-primary {
                background-color: #0066cc !important;
                border-color: #0066cc !important;
            }

            .btn-primary:hover {
                background-color: #0052a3 !important;
                border-color: #0052a3 !important;
                transform: translateY(-2px);
            }

            .form-control {
                transition: all 0.2s ease;
            }

            .form-control:focus {
                border-color: #0066cc !important;
                box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.1) !important;
            }

            tbody tr:hover {
                background-color: #f5f7fa !important;
            }

            @media (max-width: 768px) {
                h1 {
                    font-size: 1.5rem !important;
                }

                .table {
                    font-size: 0.9rem;
                }

                td, th {
                    padding: 0.75rem 0.5rem !important;
                }
            }
        </style>
    </main>
</body>
</html>
