<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{fragments/head :: head(~{})},~{::main})}"
      xmlns:th="http://www.thymeleaf.org">

<body>
<main>
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h1>Vendas da Empresa <span th:text="${nomeEmpresa}"></span></h1>
    </div>

    <!-- Formulário de Filtro por Data -->
    <div class="filter-form" style="margin-bottom: 20px; padding: 15px; background-color: #f9f9f9; border-radius: 5px;">
        <h5>Filtrar por Período</h5>
        <form method="get" th:action="@{/vendas/empresa/{id}(id=${empresa.id})}" style="display: flex; gap: 10px; flex-wrap: wrap; align-items: center;">

            <div style="flex: 1; min-width: 200px;">
                <label for="dataInicio">Data Início:</label>
                <input type="date" id="dataInicio" name="dataInicio" th:value="${dataInicio}" style="width: 100%; padding: 5px;">
            </div>

            <div style="flex: 1; min-width: 200px;">
                <label for="dataFim">Data Fim:</label>
                <input type="date" id="dataFim" name="dataFim" th:value="${dataFim}" style="width: 100%; padding: 5px;">
            </div>

            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button type="submit" class="btn btn-primary">Filtrar</button>
                <a th:href="@{/vendas/empresa/{id}(id=${empresa.id})}" class="btn btn-secondary">Limpar Filtros</a>
            </div>
        </form>
    </div>

    <div th:if="${listaVendas.isEmpty()}" class="empty-message" style="text-align: center; padding: 60px; background-color: #f9f9f9; border-radius: 8px;">
        <p style="font-size: 18px; color: #999;">Nenhuma venda encontrada para esta empresa.</p>
    </div>

    <div class="table-responsive" th:unless="${listaVendas.isEmpty()}">
        <table class="table table-hover table-striped">
            <thead class="table-light">
            <tr>
                <th>ID</th>
                <th>Data</th>
                <th class="text-center">Quantidade de Itens</th>
                <th class="text-right">Total</th>
                <th class="text-center">Ação</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="venda : ${listaVendas}">
                <td th:text="${venda.id}"></td>
                <td th:text="${#temporals.format(venda.getData(), 'dd/MM/yyyy HH:mm')}"></td>
                <td class="text-center" th:text="${venda.itens.size()}"></td>
                <td class="text-right" th:text="|R$ ${#numbers.formatDecimal(venda.total(), 1, 2)}|" style="font-weight: bold; color: #28a745;"></td>
                <td class="text-center">
                    <a th:href="@{/vendas/{id}(id=${venda.id})}" class="btn btn-sm btn-outline-primary">Detalhes</a>
                </td>
            </tr>
            </tbody>

        </table>
    </div>

    <div style="margin-top: 30px; display: flex; gap: 10px;">
        <a href="/empresa" class="btn btn-outline-secondary">← Voltar para Empresas</a>
        <a href="/vendas" class="btn btn-outline-info">Ver Todas as Vendas</a>
    </div>
</main>
</body>
</html>
