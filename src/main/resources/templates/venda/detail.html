<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{fragments/head :: head(~{})},~{::main})}" xmlns:th="http://www.thymeleaf.org">

<main>
    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
            <h1>Detalhes da Compra</h1>
        </div>

        <div class="row mb-4">
            <div class="col-md-6">
                <div class="card border-light shadow-sm p-4">
                    <h5 class="card-title">Informações da Compra</h5>
                    <hr>
                    <div th:if="${venda}" style="line-height: 1.8;">
                        <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                            <strong>ID da Compra:</strong>
                            <span th:text="${venda.id}"></span>
                        </div>
                        <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                            <strong>Data:</strong>
                            <span th:text="${#temporals.format(venda.data, 'dd/MM/yyyy HH:mm')}"></span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card border-light shadow-sm p-4">
                    <h5 class="card-title">Informações do Cliente</h5>
                    <hr>
                    <div th:if="${venda.cliente}" style="line-height: 1.8;">
                        <div style="display: grid; grid-template-columns: auto 1fr; gap: 1rem; margin-bottom: 10px; align-items: start;">
                            <strong style="white-space: nowrap;">Cliente:</strong>
                            <span style="word-break: break-word;" th:text="${venda.cliente instanceof T(com.example.projetopweb.model.entity.PessoaFisica) ? venda.cliente.nome : venda.cliente.razaoSocial}"></span>
                        </div>
                        <div style="display: grid; grid-template-columns: auto 1fr; gap: 1rem; margin-bottom: 10px; align-items: start;">
                            <strong style="white-space: nowrap;">Email:</strong>
                            <span style="word-break: break-word;" th:text="${venda.cliente.email}"></span>
                        </div>
                        <div style="display: grid; grid-template-columns: auto 1fr; gap: 1rem; align-items: start;">
                            <strong style="white-space: nowrap;">Telefone:</strong>
                            <span style="word-break: break-word;" th:text="${venda.cliente.telefone}"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <h3>Itens da Compra</h3>

        <div th:if="${venda.itens.isEmpty()}" class="empty-message">
            <p>Nenhum item nesta venda.</p>
        </div>

        <div class="table-responsive mb-4" th:unless="${venda.itens.isEmpty()}">
            <table class="table table-hover table-striped">
                <thead class="table-light">
                    <tr>
                        <th>Produto</th>
                        <th class="text-center">Quantidade</th>
                        <th class="text-center">Valor Unitário</th>
                        <th class="text-center">Subtotal</th>
                    </tr>
                </thead>

                <tbody>
                    <tr th:each="item : ${venda.itens}">
                        <td th:text="${item.produto.descricao}"></td>
                        <td class="text-center" th:text="${item.quantidade}"></td>
                        <td class="text-center" th:text="|R$ ${#numbers.formatDecimal(item.produto.valor, 1, 2)}|"></td>
                        <td class="text-center" th:text="|R$ ${#numbers.formatDecimal(item.total(), 1, 2)}|" style="font-weight: bold; color: #28a745;"></td>
                    </tr>

                    <tr style="background-color: #f8f9fa; font-weight: bold;">
                        <td colspan="3" style="text-align: right; padding: 15px;">TOTAL DA COMPRA:</td>
                        <td style="text-align: center; padding: 15px; color: #28a745; font-size: 18px;" th:text="|R$ ${#numbers.formatDecimal(venda.total(), 1, 2)}|"></td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div style="display: flex; gap: 10px;">
            <a href="/vendas" class="btn btn-outline-secondary">← Voltar para Vendas</a>
            <a th:href="@{/vendas/cliente/{id}(id=${venda.cliente.id})}" class="btn btn-outline-primary">Ver Outras Compras do Cliente</a>
            <a href="/produtos/loja" class="btn btn-success">🛒 Fazer Nova Compra</a>
        </div>
    </div>
</main>
</html>
