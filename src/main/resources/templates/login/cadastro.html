<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

    <head>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width, user-scalable=no"/>
        <title>Criar Conta - Sistema de Vendas</title>

        <!-- Bootstrap CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">

        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                background-color: #fafbfc;
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
            }

            .navbar {
                background: linear-gradient(135deg, #0066cc 0%, #0052a3 100%);
                box-shadow: 0 4px 12px rgba(0, 102, 204, 0.15);
                padding: 0.75rem 1.5rem;
            }

            .navbar-brand {
                color: white !important;
                font-size: 1.5rem;
                font-weight: 700;
                letter-spacing: 0.5px;
            }

            .navbar-link {
                color: rgba(255, 255, 255, 0.85) !important;
                font-size: 14px;
                text-decoration: none;
                transition: color 0.2s ease;
            }

            .navbar-link:hover {
                color: white !important;
            }

            .login-container {
                flex: 1;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 2rem 1rem;
            }

            .login-wrapper {
                width: 100%;
                max-width: 450px;
            }

            .card {
                border: none;
                border-radius: 12px;
                box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
                overflow: hidden;
            }

            .card-header {
                background: linear-gradient(135deg, #0066cc 0%, #0052a3 100%);
                color: white;
                padding: 30px;
                text-align: center;
                border: none;
            }

            .card-header h5 {
                margin: 0;
                font-size: 24px;
                font-weight: 600;
            }

            .card-header p {
                margin: 8px 0 0 0;
                font-size: 14px;
                opacity: 0.85;
            }

            .card-body {
                padding: 40px;
            }

            .form-group {
                margin-bottom: 20px;
            }

            .form-group label {
                display: block;
                margin-bottom: 8px;
                font-weight: 500;
                color: #333;
                font-size: 14px;
            }

            .form-control {
                padding: 12px 15px;
                border: 2px solid #e0e0e0;
                border-radius: 6px;
                font-size: 14px;
                transition: all 0.3s ease;
                background-color: #fafbfc;
                width: 100%;
            }

            .form-control:focus {
                border-color: #0066cc;
                box-shadow: 0 0 0 0.2rem rgba(0, 102, 204, 0.25);
                background-color: white;
                outline: none;
            }

            .btn-primary {
                width: 100%;
                padding: 12px;
                background: linear-gradient(135deg, #0066cc 0%, #0052a3 100%);
                border: none;
                border-radius: 6px;
                font-weight: 600;
                font-size: 16px;
                transition: all 0.3s ease;
                margin-top: 10px;
                color: white;
                cursor: pointer;
            }

            .btn-primary:hover {
                transform: translateY(-2px);
                box-shadow: 0 10px 20px rgba(0, 102, 204, 0.3);
                background: linear-gradient(135deg, #0052a3 0%, #003d7a 100%);
                color: white;
            }

            .alert {
                border: none;
                border-radius: 6px;
                margin-bottom: 20px;
            }

            .alert-danger {
                background-color: #f8d7da;
                color: #721c24;
                border-left: 4px solid #f5c6cb;
                padding: 12px 16px;
            }

            .divider {
                display: flex;
                align-items: center;
                margin: 20px 0;
                color: #aaa;
                font-size: 13px;
            }

            .divider::before,
            .divider::after {
                content: '';
                flex: 1;
                height: 1px;
                background: #e0e0e0;
            }

            .divider span {
                padding: 0 12px;
            }

            .link-login {
                display: block;
                text-align: center;
                color: #0066cc;
                font-size: 14px;
                text-decoration: none;
                font-weight: 500;
                padding: 10px;
                border-radius: 6px;
                border: 2px solid #0066cc;
                transition: all 0.3s ease;
            }

            .link-login:hover {
                background-color: #0066cc;
                color: white;
            }

            .info-box {
                background: linear-gradient(135deg, #f0f7ff 0%, #fff 100%);
                border-radius: 8px;
                padding: 14px;
                margin-top: 20px;
                border-left: 4px solid #0066cc;
                font-size: 13px;
                color: #555;
            }

            .info-box p {
                margin: 0;
            }

            .footer {
                background-color: #f5f7fa;
                border-top: 1px solid #e0e0e0;
                padding: 2rem 1rem;
                text-align: center;
                color: #667;
                font-size: 14px;
                margin-top: auto;
            }

            @media (max-width: 768px) {
                .login-container {
                    padding: 1rem;
                }

                .card-body {
                    padding: 30px;
                }

                .card-header h5 {
                    font-size: 20px;
                }
            }
        </style>
    </head>

    <body>
        <!-- Header -->
        <nav class="navbar navbar-expand-lg">
            <div class="container-fluid d-flex justify-content-between align-items-center">
                <a class="navbar-brand" href="/">💼 Loja Virtual</a>
                <a class="navbar-link" th:href="@{/login}">← Voltar ao Login</a>
            </div>
        </nav>

        <!-- Conteúdo do cadastro -->
        <div class="login-container">
            <div class="login-wrapper">

                <!-- Mensagem de erro -->
                <div th:if="${erro}">
                    <div class="alert alert-danger" role="alert">
                        <strong>❌ Erro!</strong> <span th:text="${erro}"></span>
                    </div>
                </div>

                <!-- Cartão com o formulário -->
                <div class="card">
                    <div class="card-header">
                        <h5>📝 Criar Nova Conta</h5>
                        <p>Preencha os dados abaixo para se cadastrar</p>
                    </div>

                    <div class="card-body">
                        <form th:action="@{/cadastro}" method="post">

                            <!-- Campo de Login -->
                            <div class="form-group">
                                <label for="login">👤 Login:</label>
                                <input class="form-control"
                                       id="login"
                                       type="text"
                                       name="login"
                                       placeholder="Escolha um nome de usuário"
                                       required
                                       autofocus/>
                            </div>

                            <!-- Campo de Nome -->
                            <div class="form-group">
                                <label for="nome">🧑 Nome de Exibição:</label>
                                <input class="form-control"
                                       id="nome"
                                       type="text"
                                       name="nome"
                                       placeholder="Digite seu nome"
                                       required/>
                            </div>

                            <!-- Campo de Email -->
                            <div class="form-group">
                                <label for="email">📧 Email:</label>
                                <input class="form-control"
                                       id="email"
                                       type="email"
                                       name="email"
                                       placeholder="Digite seu email"
                                       required/>
                            </div>

                            <!-- Campo de Telefone -->
                            <div class="form-group">
                                <label for="telefone">📞 Telefone:</label>
                                <input class="form-control"
                                       id="telefone"
                                       type="tel"
                                       name="telefone"
                                       placeholder="Digite seu telefone"/>
                            </div>

                            <!-- Campo de Senha -->
                            <div class="form-group">
                                <label for="senha">🔑 Senha:</label>
                                <input class="form-control"
                                       id="senha"
                                       type="password"
                                       name="senha"
                                       placeholder="Crie uma senha"
                                       required/>
                            </div>

                            <!-- Campo de Confirmação de Senha -->
                            <div class="form-group">
                                <label for="confirmaSenha">🔒 Confirmar Senha:</label>
                                <input class="form-control"
                                       id="confirmaSenha"
                                       type="password"
                                       name="confirmaSenha"
                                       placeholder="Repita a senha"
                                       required/>
                            </div>

                            <!-- Botão de Cadastro -->
                            <button type="submit" class="btn btn-primary">✅ Criar Conta</button>
                        </form>

                        <div class="divider"><span>ou</span></div>

                        <!-- Link para voltar ao login -->
                        <a th:href="@{/login}" class="link-login">🔐 Já tenho uma conta</a>

                        <!-- Informação -->
                        <div class="info-box">
                            <p>ℹ️ Ao criar uma conta, você terá acesso como <strong>usuário comum</strong> ao sistema.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <footer class="footer">
            <p>&copy; 2026 Loja Virtual – Por João Paulo Guerra</p>
        </footer>

        <!-- Bootstrap JS -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
                integrity="sha384-w76AqPfDkMBDXo30jS1Sgez6pr3x5MlQ1ZAGC+nuZB+EYdgRZgiwxhTBTkF7FIc7"
                crossorigin="anonymous"></script>
    </body>

</html>
